name: Bug
description: Reportar un comportamiento incorrecto.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Hacer clic en ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - Preview
        - Producción
        - Local
    validations:
      required: true
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
      description: Arrastra imágenes o pega enlaces.
